[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rangevalidator-python"
version = "0.3.0"
description = "Offline Korean GUI C bit-field range validation and selected Excel COM correction"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1.5,<4", "Pillow>=13,<14", "pcpp==1.30", "pywin32>=308; sys_platform == 'win32'"]

[project.scripts]
rangevalidator = "rangevalidator.cli:main"

[tool.setuptools.packages.find]
include = ["rangevalidator*"]
